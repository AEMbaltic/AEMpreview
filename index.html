<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>AEM Baltic — Digital Marketing Agency</title>
    <meta name="description" content="AEM Baltic turns attention into growth — strategy, creative and media that move numbers, not just impressions." />
    <link rel="icon" type="image/png" href="/logo-aem-baltic.png" />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="loader" class="loader">
      <div class="loader-mark" role="img" aria-label="AEM Baltic"></div>
      <div class="loader-bar"><div class="loader-bar-fill" id="loader-fill"></div></div>
    </div>

    <header class="site-header">
      <a class="logo" href="#top" aria-label="AEM Baltic"></a>
      <a class="header-cta" href="#contact">Start a project</a>
    </header>

    <!-- Single shared stage: every scene's frames draw here, so scene
         handoffs never slide — the background scrubs continuously. -->
    <canvas id="stage" aria-hidden="true"></canvas>
    <div class="stage-vignette" aria-hidden="true"></div>

    <main id="app"><!-- scenes are built by src/main.js from src/content.js --></main>

    <div class="contact-modal" id="contact-modal" hidden>
      <div class="contact-backdrop" data-close></div>
      <div class="contact-card" role="dialog" aria-modal="true" aria-labelledby="contact-title">
        <button class="contact-close" type="button" data-close aria-label="Close">&times;</button>
        <h3 id="contact-title">Start a project</h3>
        <p class="contact-sub">Tell us a little about it — we’ll get back to you within a day.</p>
        <form id="contact-form" novalidate>
          <input type="text" name="_honey" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true" />
          <label>Your name
            <input type="text" name="name" required autocomplete="name" placeholder="Jane Doe" />
          </label>
          <label>Email
            <input type="email" name="email" required autocomplete="email" placeholder="jane@company.com" />
          </label>
          <label>What are we building?
            <textarea name="message" rows="4" required placeholder="A landing page like this one…"></textarea>
          </label>
          <button class="contact-submit" type="submit">Send inquiry</button>
          <div class="contact-status" role="status"></div>
        </form>
      </div>
    </div>

    <div class="scroll-hint" id="scroll-hint">
      <span>Scroll</span>
      <div class="scroll-hint-line"></div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
